name: Keep Streamlit apps awake

# Streamlit Community Cloud sleeps apps after ~12h without visitor sessions.
# This visits both SLUGGER stats apps with a real browser every 6 hours so the
# dashboard tiles never hit the "wake me up" screen (which breaks inside the
# host iframe with a redirect loop).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@^1.50.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null

      - name: Visit apps (clicks wake button if asleep)
        run: node .github/keepalive.js
